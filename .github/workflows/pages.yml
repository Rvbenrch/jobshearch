name: Publicar demo visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/demo*'
      - 'demo.html'
      - 'vite.demo.config.js'
      - 'scripts/demo-build.mjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
